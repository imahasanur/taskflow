<div class="app-shell" [class.has-sidebar]="showSidebar() && auth.isAuthenticated()">
  @if (showSidebar() && auth.isAuthenticated()) {
    <!-- Mobile overlay -->
    @if (mobileSidebarOpen()) {
      <div class="mobile-overlay" (click)="mobileSidebarOpen.set(false)"></div>
    }

    <!-- Mobile header -->
    <header class="mobile-header">
      <button class="hamburger" (click)="toggleMobileSidebar()">
        <svg viewBox="0 0 20 20" fill="currentColor" width="20">
          <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
        </svg>
      </button>
      <span class="mobile-brand">TaskFlow</span>
    </header>

    <!-- Sidebar -->
    <div class="sidebar-wrapper" [class.mobile-open]="mobileSidebarOpen()">
      <app-sidebar (closeMobile)="mobileSidebarOpen.set(false)" />
    </div>

    <!-- Main content -->
    <main class="main-content">
      <router-outlet />
    </main>
  } @else {
    <router-outlet />
  }
</div>
